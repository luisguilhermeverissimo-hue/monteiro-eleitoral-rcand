  Painel de Registro de Candidatura (RRC) — Monteiro e Monteiro Advogados
  Arquivo único, autossuficiente. Nenhuma requisição externa além da leitura
  da própria planilha.

  Dois módulos, navegados por hash:
    #visao        panorama — números, distribuições, cartões de DRAP
    #diligencias  fila de trabalho — diligências abertas e todos os candidatos

  disco não funciona: a origem passa a ser `null` e o Google não devolve o
  cabeçalho de liberação de origem, então o navegador bloqueia a leitura.

  Gêmeo do app Next.js deste repositório. As regras de saneamento são as
  mesmas de src/lib/normalizar.ts — ver §3 do PLANO-DE-DESENVOLVIMENTO.md.
-->

:root {
  --fundo: #f6f5f0;
  --carta: #ffffff;
  --elevado: #faf9f5;
  --linha: #e5e0d5;
  --linha-forte: #ccc8be;
  --tinta: #1a1a1a;
  --tinta-suave: #3a3a3a;
  --tinta-muda: #8a8680;
  --verde: #006851;
  --verde-acento: #00a170;
  --prata: #aeadb3;
  --verde-soft: rgba(0, 104, 81, .08);
  --verde-badge: rgba(0, 104, 81, .12);
  --verde-borda: rgba(0, 104, 81, .18);
  --critico: #bb0000;
  --critico-fundo: #fff3f3;
  --atencao: #b06000;
  --atencao-fundo: #fdf8f2;
  --serie-1: #007a55;
  --sombra: 0 1px 3px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
  --sombra-hover: 0 4px 8px rgba(0,0,0,.07), 0 12px 28px rgba(0,0,0,.08);
  --raio: 2px;
  --raio-controle: 4px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--fundo);
  color: var(--tinta);
  font-family: Jost, ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
:where(a, button, input, select, [tabindex]):focus-visible {
  outline: 2px solid var(--verde);
  outline-offset: 2px;
  border-radius: var(--raio);
}
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1152px; margin: 0 auto; padding: 40px 24px; }

/* ---- cabeçalho ---- */
.topo {
  display: flex; flex-wrap: wrap; align-items: flex-end;
  justify-content: space-between; gap: 16px; margin-bottom: 24px;
}
.eyebrow {
  display: flex; align-items: center; gap: 10px;
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--tinta-muda);
}
.eyebrow::before { content: ""; width: 24px; height: 1.5px; background: var(--verde); }
h1 { margin: 4px 0 0; font-size: 38px; font-weight: 300; letter-spacing: -.02em; }
h1 em { font-style: normal; font-weight: 400; color: var(--verde); }
.subtitulo { margin: 4px 0 0; font-size: 14px; color: var(--tinta-muda); }
.controle-topo { display: flex; align-items: center; gap: 12px; }
.carimbo { font-size: 12px; color: var(--tinta-muda); }

/* ---- navegação entre módulos ---- */
.nav {
  display: flex; gap: 4px; margin-bottom: 40px;
  border-bottom: 1px solid var(--linha);
}
.nav a {
  display: flex; align-items: center;
  padding: 10px 18px 12px; margin-bottom: -1px;
  font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tinta-muda); text-decoration: none;
  border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
}
.nav a:hover { color: var(--tinta-suave); }
.nav a[aria-current="page"] { color: var(--verde); border-bottom-color: var(--verde); }
.nav-conta {
  margin-left: 8px; padding: 1px 6px; font-size: 10px;
  background: var(--verde-badge); border-radius: var(--raio); color: var(--verde);
}

/* ---- seções ---- */
section { margin-top: 48px; }
section:first-of-type { margin-top: 0; }
.section-label {
  display: flex; align-items: center; gap: 12px; margin: 0 0 14px;
  font-size: 10px; font-weight: 400; letter-spacing: .18em;
  text-transform: uppercase; color: var(--tinta-muda);
}
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--linha); }
.nota-secao { max-width: 42rem; margin: 0 0 16px; font-size: 14px; color: var(--tinta-muda); }

/* ---- indicadores ---- */
.kpi-strip {
  display: grid; grid-template-columns: repeat(4, 1fr);
  border: 1px solid var(--linha); background: var(--carta); box-shadow: var(--sombra);
}
.kpi-cell { position: relative; padding: 24px 28px; border-right: 1px solid var(--linha); }
.kpi-cell:last-child { border-right: none; }
.kpi-cell::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--verde); }
.kpi-cell:nth-child(2)::before { background: var(--verde-acento); }
.kpi-cell:nth-child(3)::before { background: var(--prata); }
.kpi-cell:nth-child(4)::before { background: var(--tinta); }
.kpi-cell-label { margin-bottom: 12px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-muda); }
.kpi-cell-value { font-size: 40px; font-weight: 400; line-height: 1; letter-spacing: -.02em; }
.kpi-cell:first-child .kpi-cell-value { color: var(--verde); }
.kpi-cell-note { margin-top: 8px; font-size: 12px; color: var(--tinta-muda); }

/* ---- cartões ---- */
.chart-card {
  padding: 22px 24px; background: var(--carta);
  border: 1px solid var(--linha); box-shadow: var(--sombra); transition: box-shadow .2s;
}
.chart-card:hover { box-shadow: var(--sombra-hover); }
.chart-title { margin-bottom: 3px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--tinta-muda); }
.chart-subtitle { font-size: 13px; color: var(--tinta-suave); }
.grade-2 { display: grid; gap: 24px; grid-template-columns: repeat(2, 1fr); }
.grade-cartoes { display: grid; gap: 16px; grid-template-columns: repeat(3, 1fr); }

/* ---- etiquetas ---- */
.uf-badge {
  display: inline-block; padding: 2px 7px; font-size: 10px; font-weight: 600; letter-spacing: .05em;
  color: var(--verde); background: var(--verde-badge); border: 1px solid var(--verde-borda); border-radius: var(--raio);
}
.cargo-badge {
  display: inline-block; padding: 2px 8px; font-size: 10px; font-weight: 500; letter-spacing: .04em; white-space: nowrap;
  color: var(--tinta-suave); background: rgba(26,26,26,.06); border: 1px solid rgba(26,26,26,.14); border-radius: var(--raio);
}
.drap-badge {
  display: inline-block; padding: 2px 8px; font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--atencao); background: rgba(176,96,0,.09); border: 1px solid rgba(176,96,0,.22); border-radius: var(--raio);
}

/* ---- barras ---- */
.barra-linha { display: grid; grid-template-columns: 7rem 1fr 3rem; align-items: center; gap: 12px; font-size: 14px; }
.barra-rotulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tinta-suave); }
.barra-track { height: 5px; overflow: hidden; background: var(--linha); border-radius: var(--raio); }
.barra-fill { height: 100%; background: var(--verde); border-radius: var(--raio); transition: width .7s ease; }
.barra-valor { text-align: right; color: var(--tinta-muda); }
.lista-limpa { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }

/* ---- fila de diligências ---- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.linha-chips { margin-bottom: 16px; }
.chips-rotulo {
  display: block; margin-bottom: 7px; font-size: 9px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--tinta-muda);
}
.chip {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; font-family: inherit; font-size: 11px; font-weight: 500;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--tinta-muda); background: var(--carta);
  border: 1px solid var(--linha); border-radius: var(--raio-controle);
  cursor: pointer; transition: all .15s;
}
.chip:hover:not(:disabled) { border-color: var(--linha-forte); color: var(--tinta-suave); }
.chip:disabled { opacity: .45; cursor: default; }
.chip .conta { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { color: var(--verde); border-color: var(--verde); background: var(--verde-badge); }
.chip-critico .conta { color: var(--critico); }
.chip-atencao .conta { color: var(--atencao); }
.chip-cumprida .conta { color: var(--verde); }
.chip:disabled .conta { color: inherit; }

.fila { display: grid; gap: 10px; }
.dil-item {
  /* Identificação · categoria · prazo fatal · status. As três últimas são
     rotuladas, e `start` alinha os rótulos com a fileira de etiquetas. */
  display: grid; gap: 4px 20px; align-items: start;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.15fr) 10rem 8.5rem;
  padding: 16px 20px 16px 18px;
  background: var(--carta); border: 1px solid var(--linha);
  border-left: 3px solid var(--linha-forte);
  box-shadow: var(--sombra); transition: box-shadow .2s;
}
.dil-item:hover { box-shadow: var(--sombra-hover); }
.dil-critico { border-left-color: var(--critico); background: var(--critico-fundo); }
.dil-atencao { border-left-color: var(--atencao); background: var(--atencao-fundo); }
.dil-cumprida { border-left-color: var(--verde); }
.dil-cumprida .dil-nome { color: var(--tinta-suave); font-weight: 400; }
.dil-identificacao { min-width: 0; }
.dil-marcas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 5px; }
.dil-nome {
  margin: 0; font-size: 15px; font-weight: 500; color: var(--tinta);
  overflow: hidden; text-overflow: ellipsis;
}
.dil-desc { margin: 0; font-size: 14px; color: var(--tinta-suave); }
.dil-proc { margin: 3px 0 0; }
.proc {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10.5px; white-space: nowrap; color: var(--tinta-muda);
}
.dil-status {
  font-size: 11px; font-weight: 500; letter-spacing: .06em;
  text-transform: uppercase; color: var(--tinta-muda);
}
.dil-prazo, .dil-coluna-status { font-size: 14px; }
.rotulo-campo {
  display: block; margin-bottom: 5px;
  font-size: 9px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--tinta-muda);
}

/* Status do registro de candidatura — §3.4 */
.dil-rcand { margin: 8px 0 0; }
.rcand-badge {
  display: inline-block; padding: 2px 8px;
  font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  border-radius: var(--raio);
}
.rcand-neutro {
  color: var(--tinta-suave); background: rgba(26, 26, 26, .05);
  border: 1px solid rgba(26, 26, 26, .16);
}
.rcand-bom {
  color: var(--verde); background: var(--verde-badge); border: 1px solid var(--verde-borda);
}
.rcand-atencao {
  color: var(--atencao); background: rgba(176, 96, 0, .09);
  border: 1px solid rgba(176, 96, 0, .22);
}
.rcand-critico {
  color: var(--critico); background: rgba(187, 0, 0, .07);
  border: 1px solid rgba(187, 0, 0, .22);
}

/* ---- tabelas ---- */
.tabela-wrap { overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--raio); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead tr { background: var(--elevado); border-bottom: 1.5px solid var(--linha-forte); }
th {
  padding: 10px 14px; font-size: 9px; font-weight: 500; letter-spacing: .12em;
  text-transform: uppercase; text-align: left; white-space: nowrap; color: var(--tinta-muda);
}
tbody tr { border-bottom: 1px solid var(--linha); transition: background .12s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:nth-child(even) { background: var(--elevado); }
tbody tr:hover, tbody tr:nth-child(even):hover { background: var(--verde-soft); }
td { padding: 9px 14px; color: var(--tinta-suave); vertical-align: middle; }
.vazio { padding: 40px 24px; text-align: center; color: var(--tinta-muda); }
.caixa-vazia {
  padding: 40px 24px; text-align: center; color: var(--tinta-muda); font-size: 14px;
  background: var(--carta); border: 1px solid var(--linha); box-shadow: var(--sombra);
}

/* ---- semáforo ----
   O status prevalece sobre a contagem: cumprida é verde, nunca alerta. */
.prazo-critico { font-weight: 600; color: var(--critico); }
.prazo-atencao { font-weight: 500; color: var(--atencao); }
.prazo-neutro { color: var(--tinta-muda); }
.prazo-cumprida { font-weight: 500; color: var(--verde); }
.status-cumprida { color: var(--verde); }
.status-aberta, .vazio-celula { color: var(--tinta-muda); }

/* ---- controles ---- */
.btn-secundario {
  padding: 6px 14px; font-family: inherit; font-size: 10px; font-weight: 500;
  letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-muda);
  background: transparent; border: 1px solid var(--linha-forte);
  border-radius: var(--raio-controle); cursor: pointer; transition: all .15s;
}
.btn-secundario:hover:not(:disabled) { color: var(--verde); border-color: var(--verde); }
.btn-secundario:disabled { opacity: .5; cursor: default; }
.filtros { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
.filtros input[type="search"], .filtros select {
  padding: 8px 12px; font-family: inherit; font-size: 14px; color: var(--tinta);
  background: var(--carta); border: 1px solid var(--linha); border-radius: var(--raio-controle);
}
.filtros input[type="search"] { flex: 1; min-width: 15rem; }
.filtros label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--tinta-suave); }

/* ---- paginação ---- */
.paginacao {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px; margin-top: 16px;
}
.paginas { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pag-btn {
  min-width: 32px; padding: 6px 10px; font-family: inherit; font-size: 12px;
  font-variant-numeric: tabular-nums; color: var(--tinta-suave);
  background: var(--carta); border: 1px solid var(--linha);
  border-radius: var(--raio-controle); cursor: pointer; transition: all .15s;
}
.pag-btn:hover:not(:disabled):not([aria-current]) { border-color: var(--verde); color: var(--verde); }
.pag-btn:disabled { opacity: .4; cursor: default; }
.pag-btn[aria-current="true"] {
  color: #fff; background: var(--verde); border-color: var(--verde); font-weight: 500; cursor: default;
}
.pag-elipse { padding: 0 4px; color: var(--tinta-muda); }
.pag-info { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--tinta-muda); }
.pag-info label { display: flex; align-items: center; gap: 6px; }
.pag-info select {
  padding: 4px 8px; font-family: inherit; font-size: 12px; color: var(--tinta-suave);
  background: var(--carta); border: 1px solid var(--linha); border-radius: var(--raio-controle);
}

footer {
  margin-top: 48px; padding-top: 24px;
  border-top: 1px solid var(--linha); font-size: 12px; color: var(--tinta-muda);
}

/* ---- estados de página inteira ---- */
.tela-cheia { max-width: 40rem; margin: 0 auto; padding: 96px 24px; }
.tela-cheia h1 { font-size: 30px; }
.tela-cheia p { font-size: 14px; color: var(--tinta-suave); }
.tela-cheia .detalhe { font-family: ui-monospace, monospace; font-size: 12px; color: var(--tinta-muda); }

@media (max-width: 1024px) {
  /* Identificação ocupa a largura toda; categoria, prazo e status dividem a
     linha de baixo, mantendo os três rótulos alinhados entre si. */
  .dil-item { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dil-identificacao { grid-column: 1 / -1; margin-bottom: 4px; }
}
@media (max-width: 960px) {
  .kpi-strip { grid-template-columns: 1fr 1fr; }
  .kpi-cell:nth-child(2) { border-right: none; }
  .grade-2, .grade-cartoes { grid-template-columns: 1fr; }
  h1 { font-size: 30px; }
}
@media (min-width: 641px) and (max-width: 1024px) {
  .grade-cartoes { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .dil-item { grid-template-columns: 1fr; gap: 12px; }
  .dil-identificacao { margin-bottom: 0; }
  .paginacao { justify-content: center; }
}

<body>
<div id="raiz" class="wrap">
  <p class="carimbo">Lendo a planilha…</p>
</div>

<script>
"use strict";
(function () {

/* ================================================================== */
/*  Configuração                                                       */
/* ================================================================== */

var PLANILHA_ID = "19LLptppzNNE9bjDpgLAoRbbzeZT6TUx0Xw6QnNqxZfI";
var ABA = "PROCESSOS DO DRAP";
var FUSO = "America/Recife";
var INTERVALO = 60; // segundos entre releituras automáticas

function urlCSV() {
  return "https://docs.google.com/spreadsheets/d/" + PLANILHA_ID +
         "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(ABA) +
         // Sem isto o navegador serve a resposta do próprio cache e o botão
         // Atualizar não traz nada de novo.
         "&_=" + Date.now();
}

/* ================================================================== */
/*  Transporte — análise de CSV conforme RFC 4180                      */
/* ================================================================== */

function analisarCSV(texto) {
  var linhas = [], linha = [], campo = "", entreAspas = false;
  for (var i = 0; i < texto.length; i++) {
    var c = texto[i];
    if (entreAspas) {
      if (c === '"') {
        if (texto[i + 1] === '"') { campo += '"'; i++; }
        else entreAspas = false;
      } else campo += c;
      continue;
    }
    if (c === '"') entreAspas = true;
    else if (c === ",") { linha.push(campo); campo = ""; }
    else if (c === "\n") { linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else if (c !== "\r") campo += c;
  }
  if (campo !== "" || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas;
}

function chaveColuna(bruto) {
  return bruto.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
              .toUpperCase().replace(/\s+/g, " ").trim();
}

function lerAba() {
  return fetch(urlCSV(), { cache: "no-store" }).then(function (r) {
    if (!r.ok) {
      throw new Error(r.status === 404
        ? 'A aba "' + ABA + '" não foi encontrada, ou a planilha deixou de estar publicada.'
        : "O Google Sheets respondeu " + r.status + ".");
    }
    return r.text();
  }).then(function (texto) {
    var grade = analisarCSV(texto);
    if (!grade.length) throw new Error("A aba veio vazia.");
    var cabecalho = grade[0].map(chaveColuna);
    // A exportação devolve a largura inteira da grade; corta o excedente vazio.
    var largura = cabecalho.length;
    while (largura > 0 && cabecalho[largura - 1] === "") largura--;
    return {
      colunas: cabecalho.slice(0, largura),
      linhas: grade.slice(1).map(function (l) {
        var linha = l.slice(0, largura);
        while (linha.length < largura) linha.push("");
        return linha;
      }),
      lidoEm: new Date()
    };
  });
}

/* ================================================================== */
/*  Prazo — §3.3 do plano                                              */
/* ================================================================== */

function hojeISO(agora) {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: FUSO, year: "numeric", month: "2-digit", day: "2-digit"
  }).format(agora || new Date());
}

function marcoUTC(iso) {
  var p = iso.split("-").map(Number);
  return Date.UTC(p[0], p[1] - 1, p[2]);
}

function diasRestantes(prazoISO, agora) {
  return Math.round((marcoUTC(prazoISO) - marcoUTC(hojeISO(agora))) / 86400000);
}

function formatarData(iso) {
  var p = iso.split("-");
  return p[2] + "/" + p[1] + "/" + p[0];
}

function rotuloPrazo(prazoISO, agora) {
  if (!prazoISO) return { texto: "Sem prazo definido", tom: "neutro", dias: null };
  var dias = diasRestantes(prazoISO, agora);
  if (dias < 0) {
    var atraso = Math.abs(dias);
    return { texto: "Vencida há " + atraso + (atraso === 1 ? " dia" : " dias"), tom: "critico", dias: dias };
  }
  if (dias === 0) return { texto: "Vence hoje", tom: "critico", dias: dias };
  if (dias === 1) return { texto: "Vence amanhã", tom: "critico", dias: dias };
  if (dias <= 7) return { texto: "Vence em " + dias + " dias", tom: "atencao", dias: dias };
  return { texto: formatarData(prazoISO), tom: "neutro", dias: dias };
}

/* Faixas do §3.3, usadas nos filtros rápidos do módulo de diligências. */
var FAIXAS = [
  { id: "vencida",   rotulo: "Vencidas",     tom: "critico" },
  { id: "hoje",      rotulo: "Vence hoje",   tom: "critico" },
  { id: "ate3",      rotulo: "Até 3 dias",   tom: "critico" },
  { id: "ate7",      rotulo: "Até 7 dias",   tom: "atencao" },
  { id: "adiante",   rotulo: "Mais adiante", tom: "neutro"  },
  { id: "sem-prazo", rotulo: "Sem prazo",    tom: "neutro"  }
];

/**
 * Tom do status de RRC — §3.4. A gravidade é a do efeito sobre a candidatura:
 * indeferido a derruba, impugnado e recurso a colocam em risco, deferido a
 * confirma, em trâmite é o estado corrente e não merece destaque.
 */
var RCAND_TOM = {
  "EM TRAMITE": "neutro",
  "DEFERIDO": "bom",
  "INDEFERIDO": "critico",
  "IMPUGNADO": "atencao",
  "RECURSO": "atencao"
};

function tomRcand(status) {
  return RCAND_TOM[semAcento(status)] || "neutro";
}

/* Situações do quadro. `aberta` e `concluida` vêm do saneamento. */
var SITUACOES = [
  { id: "",          rotulo: "Todas" },
  { id: "aberta",    rotulo: "Abertas" },
  { id: "concluida", rotulo: "Cumpridas" }
];

/**
 * Como o prazo aparece na tela.
 *
 * O status prevalece sobre a contagem: uma diligência cumprida não vence, então
 * não pode aparecer em tom de alerta. Mostra-se a data em verde, e não o
 * "Vence hoje" — que seria uma contradição num item já concluído.
 */
function apresentacaoPrazo(dil) {
  if (dil.situacao === "concluida") {
    return { texto: dil.prazoFatal ? formatarData(dil.prazoFatal) : "—", tom: "cumprida" };
  }
  if (dil.prazoFatal) {
    var r = rotuloPrazo(dil.prazoFatal);
    return { texto: r.texto, tom: r.tom };
  }
  return {
    texto: dil.prazoTexto ? dil.prazoTexto + " — sem data" : "Sem prazo definido",
    tom: "neutro"
  };
}

function faixaDe(dias) {
  if (dias === null) return "sem-prazo";
  if (dias < 0) return "vencida";
  if (dias === 0) return "hoje";
  if (dias <= 3) return "ate3";
  if (dias <= 7) return "ate7";
  return "adiante";
}

/* ================================================================== */
/*  Saneamento — as 12 regras da §3, a cada leitura                    */
/* ================================================================== */

var STATUS_CONCLUIDO = ["OK", "CUMPRIDO", "CUMPRIDA", "CONCLUIDO", "CONCLUIDA"];
var STATUS_CONHECIDO = STATUS_CONCLUIDO.concat(["PENDENTE", "EM ANDAMENTO"]);
var MARCAS_DRAP = ["GERAL", "PARTIDO NOVO"];
var CORRECOES = [
  [/PETIC[ÃA]O/gi, "PETIÇÃO"],
  [/PRTOCURA[ÇC][ÃA]O/gi, "PROCURAÇÃO"]
];
var LIXO = /^[*\s.\-_]*$/;
var SUPLENTE = /SUPLENTE/i;
var PADRAO_CNJ = /^\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}$/;

var TRE_POR_UF = {
  AC:"01", AL:"02", AP:"03", AM:"04", BA:"05", CE:"06", DF:"07", ES:"08", GO:"09",
  MA:"10", MT:"11", MS:"12", MG:"13", PA:"14", PB:"15", PR:"16", PE:"17", PI:"18",
  RJ:"19", RN:"20", RS:"21", RO:"22", RR:"23", SC:"24", SE:"25", SP:"26", TO:"27"
};

function semAcento(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
}
function apararEspacos(s) { return s.replace(/\s+/g, " ").trim(); }

function treDoProcesso(p) {
  var m = p.match(/^\d{7}-\d{2}\.\d{4}\.6\.(\d{2})\./);
  return m ? m[1] : null;
}

function dataParaISO(bruto) {
  var s = (bruto || "").trim();
  if (!s) return null;
  var br = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  var iso = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  var ano, mes, dia;
  if (br) { dia = +br[1]; mes = +br[2]; ano = +br[3]; }
  else if (iso) { ano = +iso[1]; mes = +iso[2]; dia = +iso[3]; }
  else return null;
  // Rejeita 31/02 e afins: o Date normalizaria em silêncio para 03/03.
  var d = new Date(Date.UTC(ano, mes - 1, dia));
  if (d.getUTCFullYear() !== ano || d.getUTCMonth() !== mes - 1 || d.getUTCDate() !== dia) return null;
  return ano + "-" + String(mes).padStart(2, "0") + "-" + String(dia).padStart(2, "0");
}

function indice(colunas) {
  for (var i = 1; i < arguments.length; i++) {
    var j = colunas.indexOf(chaveColuna(arguments[i]));
    if (j !== -1) return j;
  }
  return -1;
}

function normalizar(aba) {
  var cols = aba.colunas;
  var col = {
    uf: indice(cols, "ESTADO", "UF"),
    cargo: indice(cols, "CARGO"),
    urna: indice(cols, "NUMERO DO CANDIDATO", "NUMERO"),
    nome: indice(cols, "NOME DO CANDIDATO", "NOME"),
    processo: indice(cols, "NUMERO DO PROCESSO", "PROCESSO"),
    prazo: indice(cols, "PRAZO"),
    status: indice(cols, "STATUS"),
    tipo: indice(cols, "TIPO DA DILIGENCIA", "TIPO DE DILIGENCIA", "DILIGENCIA"),
    statusRcand: indice(cols, "STATUS RCAND", "STATUS DO RCAND", "STATUS RRC",
                              "SITUACAO RCAND", "STATUS DA CANDIDATURA"),
    // Coluna prevista; o painel acende o semáforo sozinho quando ela chegar.
    prazoFatal: indice(cols, "PRAZO FATAL", "DATA FATAL", "PRAZO_FATAL")
  };

  // O diagnóstico continua sendo apurado, embora não seja mais exibido: os
  // registros de descarte fazem parte do próprio fluxo do saneamento, e a
  // apuração é o que permite trazer a seção Saúde dos dados de volta sem
  // mexer nas regras.
  var d = {
    totalLinhas: aba.linhas.length, linhasEmBranco: 0, processosAparados: 0,
    nomesAjustados: 0, errosDigitacaoCorrigidos: 0, descartes: [],
    processosDuplicados: [], processosForaDoPadrao: [], treDivergente: [],
    combinacoesSemDrap: [], temColunaPrazoFatal: col.prazoFatal !== -1,
    prazosSemData: 0, datasInvalidas: [], statusForaDoVocabulario: []
  };

  function campo(l, i) { return i === -1 ? "" : (l[i] || "").trim(); }

  var registros = [], vistos = {}, statusEstranhos = {};

  aba.linhas.forEach(function (linha, n) {
    var numeroLinha = n + 2; // +1 cabeçalho, +1 porque a planilha conta de 1

    if (linha.every(function (c) { return c.trim() === ""; })) { d.linhasEmBranco++; return; }

    var processoBruto = col.processo === -1 ? "" : (linha[col.processo] || "");
    var processo = processoBruto.trim();
    if (processoBruto !== processo && processo !== "") d.processosAparados++;

    var uf = campo(linha, col.uf).toUpperCase();
    var cargo = campo(linha, col.cargo);

    if (!processo) {
      d.descartes.push({ linha: numeroLinha, motivo: "Linha sem número de processo",
                         valor: campo(linha, col.nome) || "(vazia)" });
      return;
    }

    var nomeBruto = campo(linha, col.nome);
    var nome = apararEspacos(nomeBruto);
    if (nome !== nomeBruto) d.nomesAjustados++;

    var urna = campo(linha, col.urna);
    // Ficha de candidato sempre tem número de urna; a ausência é o sinal
    // confiável de DRAP. A marca textual só confirma — SP mistura as duas
    // convenções dentro de si.
    var ehDrap = urna === "" || MARCAS_DRAP.indexOf(semAcento(nome)) !== -1;

    var tre = treDoProcesso(processo);
    if (!PADRAO_CNJ.test(processo)) d.processosForaDoPadrao.push(processo);
    else if (tre && TRE_POR_UF[uf] && tre !== TRE_POR_UF[uf]) {
      d.treDivergente.push({ processo: processo, uf: uf, treDoProcesso: tre });
    }

    if (vistos[processo] !== undefined) {
      d.processosDuplicados.push(processo);
      d.descartes.push({ linha: numeroLinha,
                         motivo: "Processo repetido (já na linha " + vistos[processo] + ")",
                         valor: processo });
      return;
    }
    vistos[processo] = numeroLinha;

    registros.push({
      tipo: ehDrap ? "DRAP" : "CANDIDATO",
      uf: uf, cargo: cargo, urna: urna || null,
      nome: ehDrap ? ("DRAP — " + (cargo || "sem cargo") + " / " + uf) : nome,
      processo: processo, tre: tre, partido: "NOVO", drapProcesso: null,
      // Status do registro de candidatura — §3.4. Vocabulário aberto: valor
      // desconhecido é exibido como veio, em tom neutro.
      statusRcand: campo(linha, col.statusRcand).toUpperCase() || null,
      diligencia: montarDiligencia(linha, campo, col, numeroLinha, d, statusEstranhos)
    });
  });

  d.statusForaDoVocabulario = Object.keys(statusEstranhos);
  vincularDraps(registros, d);
  return { registros: registros, diagnostico: d, lidoEm: aba.lidoEm };
}

function montarDiligencia(linha, campo, col, numeroLinha, d, statusEstranhos) {
  var prazoTexto = campo(linha, col.prazo);
  var status = campo(linha, col.status).toUpperCase();
  var bruto = campo(linha, col.tipo);
  if (!prazoTexto && !status && !bruto) return null;

  var descricao = LIXO.test(bruto) ? "" : bruto;
  if (bruto && !descricao) {
    d.descartes.push({ linha: numeroLinha, motivo: "Conteúdo inválido no campo de diligência", valor: bruto });
  }

  var antes = descricao;
  CORRECOES.forEach(function (c) { descricao = descricao.replace(c[0], c[1]); });
  if (descricao !== antes) d.errosDigitacaoCorrigidos++;

  if (!descricao && (prazoTexto || status)) descricao = "Sem descrição — verificar";
  if (!descricao) return null;

  var prazoFatal = null;
  if (col.prazoFatal !== -1) {
    var cru = campo(linha, col.prazoFatal);
    if (cru) {
      prazoFatal = dataParaISO(cru);
      if (!prazoFatal) d.datasInvalidas.push("linha " + numeroLinha + ': "' + cru + '"');
    }
  }

  var concluida = STATUS_CONCLUIDO.indexOf(semAcento(status)) !== -1;
  if (status && STATUS_CONHECIDO.indexOf(semAcento(status)) === -1) statusEstranhos[status] = true;
  if (!prazoFatal && prazoTexto && !concluida) d.prazosSemData++;

  return {
    descricao: descricao,
    status: status || "PENDENTE",
    situacao: concluida ? "concluida" : "aberta",
    prazoFatal: prazoFatal,
    prazoTexto: prazoTexto || null
  };
}

/* Suplentes de Senador não têm DRAP próprio: o registro majoritário corre num
   só processo, que cobre o titular e os dois suplentes. */
function vincularDraps(registros, d) {
  function chave(uf, cargo) {
    return uf + "|" + (SUPLENTE.test(cargo) ? "SENADOR" : semAcento(cargo));
  }
  var draps = {};
  registros.forEach(function (r) {
    if (r.tipo === "DRAP") draps[chave(r.uf, r.cargo)] = r.processo;
  });
  var orfas = {};
  registros.forEach(function (r) {
    if (r.tipo === "DRAP") return;
    var k = chave(r.uf, r.cargo);
    if (draps[k]) r.drapProcesso = draps[k];
    else {
      if (!orfas[k]) orfas[k] = { uf: r.uf, cargo: r.cargo, fichas: 0 };
      orfas[k].fichas++;
    }
  });
  d.combinacoesSemDrap = Object.keys(orfas).map(function (k) { return orfas[k]; });
}

/* ================================================================== */
/*  Agregações                                                         */
/* ================================================================== */

function contar(valores) {
  var mapa = {};
  valores.forEach(function (v) { mapa[v] = (mapa[v] || 0) + 1; });
  return Object.keys(mapa).map(function (k) { return { chave: k, n: mapa[k] }; })
               .sort(function (a, b) { return b.n - a.n; });
}

function agregar(carga, agora) {
  var registros = carga.registros;
  var fichas = registros.filter(function (r) { return r.tipo === "CANDIDATO"; });
  var draps = registros.filter(function (r) { return r.tipo === "DRAP"; });
  var comDiligencia = registros.filter(function (r) { return r.diligencia; });
  var abertas = comDiligencia.filter(function (r) { return r.diligencia.situacao === "aberta"; });

  // O quadro reúne todas as diligências, abertas e cumpridas. A faixa de
  // urgência, porém, só se aplica às abertas: uma diligência cumprida com data
  // no passado não está vencida, e contá-la como tal mentiria no semáforo.
  var diligencias = comDiligencia.map(function (r) {
    var dil = r.diligencia;
    var dias = dil.prazoFatal ? diasRestantes(dil.prazoFatal, agora) : null;
    return {
      registro: r, dias: dias,
      situacao: dil.situacao,
      faixa: dil.situacao === "concluida" ? "cumprida" : faixaDe(dias)
    };
  }).sort(function (a, b) {
    var nome = a.registro.nome.localeCompare(b.registro.nome, "pt-BR");

    // Abertas antes de cumpridas: o que exige ação vem primeiro.
    if (a.situacao !== b.situacao) return a.situacao === "aberta" ? -1 : 1;

    if (a.situacao === "concluida") {
      // Entre cumpridas, as de data mais recente primeiro.
      if (a.dias === null && b.dias === null) return nome;
      if (a.dias === null) return 1;
      if (b.dias === null) return -1;
      return b.dias - a.dias || nome;
    }

    // Entre abertas, a mais urgente primeiro; sem data vai para o fim.
    if (a.dias === null && b.dias === null) return nome;
    if (a.dias === null) return 1;
    if (b.dias === null) return -1;
    return a.dias - b.dias || nome;
  });

  var porDrap = {};
  fichas.forEach(function (f) {
    if (!f.drapProcesso) return;
    (porDrap[f.drapProcesso] = porDrap[f.drapProcesso] || []).push(f);
  });

  function aberta(r) { return r.diligencia && r.diligencia.situacao === "aberta"; }

  var gruposDrap = draps.map(function (drap) {
    var suas = (porDrap[drap.processo] || []).sort(function (a, b) {
      return a.nome.localeCompare(b.nome, "pt-BR");
    });
    return {
      drap: drap, fichas: suas,
      diligenciasAbertas: suas.filter(aberta).length + (aberta(drap) ? 1 : 0)
    };
  }).sort(function (a, b) {
    return (b.diligenciasAbertas - a.diligenciasAbertas)
        || (b.fichas.length - a.fichas.length)
        || a.drap.uf.localeCompare(b.drap.uf);
  });

  return {
    totalProcessos: registros.length,
    fichas: fichas, draps: draps, gruposDrap: gruposDrap,
    diligencias: diligencias,
    porUF: contar(registros.map(function (r) { return r.uf || "—"; })),
    porCargo: contar(registros.map(function (r) { return r.cargo || "—"; })),
    diligenciasAbertas: abertas.length,
    diligenciasConcluidas: comDiligencia.length - abertas.length,
    vencidas: diligencias.filter(function (i) { return i.faixa === "vencida"; }).length
  };
}

/* ================================================================== */
/*  Utilidades de apresentação                                         */
/* ================================================================== */

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function plural(n, um, muitos) { return n === 1 ? um : muitos; }

function horaLocal(d) {
  return new Intl.DateTimeFormat("pt-BR", { timeZone: FUSO, hour: "2-digit", minute: "2-digit" }).format(d);
}

function unicos(registros, campo) {
  var s = {};
  registros.forEach(function (r) { if (r[campo]) s[r[campo]] = true; });
  return Object.keys(s).sort(function (a, b) { return a.localeCompare(b, "pt-BR"); });
}

function opcoes(valores, selecionado) {
  return valores.map(function (v) {
    return '<option value="' + esc(v) + '"' + (v === selecionado ? " selected" : "") + ">" + esc(v) + "</option>";
  }).join("");
}

/* ================================================================== */
/*  Paginação                                                          */
/* ================================================================== */

var TAMANHOS = [25, 50, 100, 250];

function paginar(lista, est) {
  var paginas = Math.max(1, Math.ceil(lista.length / est.porPagina));
  if (est.pagina > paginas) est.pagina = paginas;
  if (est.pagina < 1) est.pagina = 1;
  var ini = (est.pagina - 1) * est.porPagina;
  return {
    itens: lista.slice(ini, ini + est.porPagina),
    total: lista.length, paginas: paginas, pagina: est.pagina,
    porPagina: est.porPagina,
    primeiro: lista.length ? ini + 1 : 0,
    ultimo: Math.min(ini + est.porPagina, lista.length)
  };
}

/* Janela de páginas com reticências, para a barra não crescer sem limite. */
function janelaPaginas(pagina, paginas) {
  if (paginas <= 7) {
    var todas = [];
    for (var i = 1; i <= paginas; i++) todas.push(i);
    return todas;
  }
  var out = [1];
  if (pagina > 4) out.push("…");
  var ini = Math.max(2, pagina - 1), fim = Math.min(paginas - 1, pagina + 1);
  for (var j = ini; j <= fim; j++) out.push(j);
  if (pagina < paginas - 3) out.push("…");
  out.push(paginas);
  return out;
}

function paginacao(nome, p) {
  var botoes = janelaPaginas(p.pagina, p.paginas).map(function (v) {
    if (v === "…") return '<span class="pag-elipse">…</span>';
    return '<button type="button" class="pag-btn" data-pag="' + nome + '" data-ir="' + v + '"' +
           (v === p.pagina ? ' aria-current="true"' : "") +
           ' aria-label="Página ' + v + '">' + v + "</button>";
  }).join("");

  return '<div class="paginacao">' +
    '<div class="paginas">' +
      '<button type="button" class="pag-btn" data-pag="' + nome + '" data-ir="' + (p.pagina - 1) + '"' +
        (p.pagina === 1 ? " disabled" : "") + ">‹ Anterior</button>" +
      botoes +
      '<button type="button" class="pag-btn" data-pag="' + nome + '" data-ir="' + (p.pagina + 1) + '"' +
        (p.pagina === p.paginas ? " disabled" : "") + ">Próxima ›</button>" +
    "</div>" +
    '<div class="pag-info">' +
      '<span class="num">' + p.primeiro + "–" + p.ultimo + " de " + p.total + "</span>" +
      "<label>por página " +
        '<select data-tamanho="' + nome + '" aria-label="Itens por página">' +
          TAMANHOS.map(function (t) {
            return '<option value="' + t + '"' + (t === p.porPagina ? " selected" : "") + ">" + t + "</option>";
          }).join("") +
        "</select></label>" +
    "</div></div>";
}

var estado = {

function moduloDoHash() {

function kpi(rotulo, valor, nota) {
  return '<div class="kpi-cell">' +
           '<div class="kpi-cell-label">' + esc(rotulo) + "</div>" +
           '<div class="kpi-cell-value num">' + valor + "</div>" +
           '<div class="kpi-cell-note">' + esc(nota) + "</div>" +
         "</div>";
}

function barras(titulo, itens, total) {
  var maior = itens.reduce(function (m, i) { return Math.max(m, i.n); }, 1);
  return '<div class="chart-card">' +
      '<div class="chart-title">' + esc(titulo) + "</div>" +
      '<div class="chart-subtitle">' + total + " processos</div>" +
      '<ul class="lista-limpa">' +
      itens.map(function (i) {
        return '<li class="barra-linha">' +
          '<span class="barra-rotulo" title="' + esc(i.chave) + '">' + esc(i.chave) + "</span>" +
          '<span class="barra-track"><span class="barra-fill" style="width:' +
            (i.n / maior * 100).toFixed(1) + '%"></span></span>' +
          '<span class="barra-valor num">' + i.n + "</span></li>";
      }).join("") +
      "</ul></div>";
}

function secaoDraps(p) {
  return '<section><h2 class="section-label">DRAPs e fichas vinculadas</h2>' +
    '<p class="nota-secao">Consolidação do número de candidatos por DRAP.</p>" +
    '<div class="grade-cartoes">' +
    p.gruposDrap.map(function (g) {
      return '<article class="chart-card">' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">' +
          '<span class="uf-badge">' + esc(g.drap.uf) + "</span>" +
          '<span class="cargo-badge">' + esc(g.drap.cargo) + "</span></div>" +
        '<p class="num" style="margin:12px 0 0;font-size:30px;font-weight:300;color:var(--verde)">' +
          g.fichas.length + "</p>" +
        '<p style="margin:0;font-size:12px;color:var(--tinta-muda)">' +
          plural(g.fichas.length, "candidatura vinculada", "candidaturas vinculadas") + "</p>" +
        '<p class="proc" style="margin:12px 0 0">' + esc(g.drap.processo) + "</p>" +
        (g.diligenciasAbertas > 0
          ? '<p style="margin:8px 0 0;font-size:12px;color:var(--atencao)">' +
            g.diligenciasAbertas + " " +
            plural(g.diligenciasAbertas, "diligência aberta", "diligências abertas") + "</p>"
          : "") +
        "</article>";
    }).join("") + "</div></section>";
}

function moduloVisao(p) {
  return '<section><h2 class="section-label">Visão geral</h2><div class="kpi-strip">' +
      kpi("Processos", p.totalProcessos, "Total na planilha") +
      kpi("Fichas de candidato", p.fichas.length, "RRC individuais") +
      kpi("DRAPs", p.draps.length, "Um por UF e cargo") +
      kpi("Diligências abertas", p.diligenciasAbertas, p.diligenciasConcluidas + " já cumpridas") +
    "</div></section>" +

    '<section><h2 class="section-label">Distribuição</h2><div class="grade-2">' +
      barras("Processos por UF", p.porUF, p.totalProcessos) +
      barras("Processos por cargo", p.porCargo, p.totalProcessos) +
    "</div></section>" +

    secaoDraps(p);
}

/* ================================================================== */
/*  Módulo 2 — Diligências                                             */
/* ================================================================== */

/* A situação é aplicada antes das demais para que as contagens das faixas de
   urgência reflitam o recorte escolhido — selecionada "Cumpridas", as faixas
   zeram e se desabilitam sozinhas, em vez de oferecerem combinações vazias. */
function porSituacao() {
  var e = estado.fila;
  return estado.painel.diligencias.filter(function (item) {
    return !e.situacao || item.situacao === e.situacao;
  });
}

function filtrarFila(base) {
  var e = estado.fila;
  var termo = semAcento(e.busca).trim().toLowerCase();
  return base.filter(function (item) {
    var r = item.registro;
    if (e.faixa && item.faixa !== e.faixa) return false;
    if (e.uf && r.uf !== e.uf) return false;
    if (e.status && r.diligencia.status !== e.status) return false;
    if (!termo) return true;
    return semAcento(r.nome + " " + r.processo + " " + r.diligencia.descricao)
             .toLowerCase().indexOf(termo) !== -1;
  });
}

function itemDaFila(item) {
  var r = item.registro, dil = r.diligencia;
  var prazo = apresentacaoPrazo(dil);

  return '<article class="dil-item dil-' + prazo.tom + '">' +
    '<div class="dil-identificacao">' +
      '<div class="dil-marcas">' +
        '<span class="uf-badge">' + esc(r.uf) + "</span>" +
        '<span class="cargo-badge">' + esc(r.cargo) + "</span>" +
        (r.tipo === "DRAP" ? '<span class="drap-badge">DRAP</span>' : "") +
      "</div>" +
      '<p class="dil-nome" title="' + esc(r.nome) + '">' + esc(r.nome) + "</p>" +
      '<p class="dil-proc proc">' + esc(r.processo) + "</p>" +
      (r.statusRcand
        ? '<p class="dil-rcand"><span class="rcand-badge rcand-' + tomRcand(r.statusRcand) + '">' +
          esc(r.statusRcand) + "</span></p>"
        : "") +
    "</div>" +
    "<div>" +
      '<span class="rotulo-campo">Categoria</span>' +
      '<p class="dil-desc">' + esc(dil.descricao) + "</p>" +
    "</div>" +
    '<div class="dil-prazo">' +
      '<span class="rotulo-campo">Prazo fatal</span>' +
      '<span class="prazo-' + prazo.tom + '">' + esc(prazo.texto) + "</span>" +
    "</div>" +
    '<div class="dil-coluna-status">' +
      '<span class="rotulo-campo">Status</span>' +
      '<span class="dil-status' + (dil.situacao === "concluida" ? " status-cumprida" : "") + '">' +
        esc(dil.status) + "</span>" +
    "</div></article>";
}

function chip(atributo, valor, rotulo, n, tom) {
  var ativo = estado.fila[atributo] === valor;
  return '<button type="button" class="chip' + (tom ? " chip-" + tom : "") + '"' +
    ' data-' + atributo + '="' + esc(valor) + '"' +
    ' aria-pressed="' + ativo + '"' +
    (n === 0 && valor !== "" ? " disabled" : "") + ">" +
    esc(rotulo) + ' <span class="conta">' + n + "</span></button>";
}

function desenharChips() {
  var alvo = document.getElementById("fila-chips");
  if (!alvo) return;

  var todas = estado.painel.diligencias;
  var base = porSituacao();

  var porFaixa = {};
  FAIXAS.forEach(function (f) { porFaixa[f.id] = 0; });
  base.forEach(function (i) {
    if (porFaixa[i.faixa] !== undefined) porFaixa[i.faixa]++;
  });

  // As faixas descrevem só as abertas — urgência não se aplica a algo cumprido.
  // O rótulo da linha diz isso, para que a soma das faixas poder ser menor que
  // o total do quadro não pareça um erro de contagem.
  var abertasNoRecorte = FAIXAS.reduce(function (t, f) { return t + porFaixa[f.id]; }, 0);

  // Sem nenhuma aberta no recorte, a linha de urgência seria uma fileira de
  // zeros. Esconde-se — mas antes solta o filtro, senão ele continuaria valendo
  // sem controle na tela para desfazê-lo.
  var mostrarUrgencia = estado.fila.situacao !== "concluida" && abertasNoRecorte > 0;
  if (!mostrarUrgencia && estado.fila.faixa) estado.fila.faixa = "";

  alvo.innerHTML =
    '<div class="linha-chips"><span class="chips-rotulo">Filtros</span>' +
      '<div class="chips">' +
        SITUACOES.map(function (s) {
          var n = s.id
            ? todas.filter(function (i) { return i.situacao === s.id; }).length
            : todas.length;
          return chip("situacao", s.id, s.rotulo, n, s.id === "concluida" ? "cumprida" : null);
        }).join("") +
      "</div></div>" +

    (!mostrarUrgencia ? "" :
      '<div class="linha-chips"><span class="chips-rotulo">Urgência das abertas</span>' +
        '<div class="chips">' +
          chip("faixa", "", "Qualquer", abertasNoRecorte, null) +
          FAIXAS.map(function (f) {
            return chip("faixa", f.id, f.rotulo, porFaixa[f.id], f.tom);
          }).join("") +
        "</div></div>");
}

function desenharFila() {
  var alvo = document.getElementById("fila-conteudo");
  if (!alvo) return;

  desenharChips();
  var p = paginar(filtrarFila(porSituacao()), estado.fila);

  if (!p.total) {
    alvo.innerHTML = '<div class="caixa-vazia">' +
      (estado.painel.diligencias.length
        ? "Nenhuma diligência corresponde aos filtros."
        : "Nenhuma diligência registrada na planilha.") + "</div>";
    return;
  }

  alvo.innerHTML = '<div class="fila">' + p.itens.map(itemDaFila).join("") + "</div>" +
                   paginacao("fila", p);
}

function filtrarTodos() {
  var e = estado.todos;
  var termo = semAcento(e.busca).trim().toLowerCase();
  return estado.carga.registros.filter(function (r) {
    if (e.uf && r.uf !== e.uf) return false;
    if (e.cargo && r.cargo !== e.cargo) return false;
    if (e.somenteDiligencia && !r.diligencia) return false;
    if (!termo) return true;
    return semAcento(r.nome + " " + r.processo + " " + (r.urna || ""))
             .toLowerCase().indexOf(termo) !== -1;
  });
}

function desenharTodos() {
  var alvo = document.getElementById("todos-conteudo");
  if (!alvo) return;

  var p = paginar(filtrarTodos(), estado.todos);

  var corpo = p.itens.length
    ? p.itens.map(function (r) {
        var dil = r.diligencia;
        var prazo = dil ? apresentacaoPrazo(dil) : null;
        return "<tr>" +
          '<td><span class="uf-badge">' + esc(r.uf) + "</span></td>" +
          "<td>" + esc(r.cargo) + "</td>" +
          '<td class="num">' + esc(r.urna || "—") + "</td>" +
          "<td>" + esc(r.nome) +
            (r.tipo === "DRAP" ? ' <span class="drap-badge">DRAP</span>' : "") + "</td>" +
          '<td class="proc">' + esc(r.processo) + "</td>" +
          "<td>" + (dil
            ? esc(dil.descricao) +
              ' <span class="' +
              (dil.situacao === "concluida" ? "status-cumprida" : "status-aberta") +
              '">(' + esc(dil.status) + ")</span>"
            : '<span class="vazio-celula">—</span>') + "</td>" +
          "<td>" + (prazo
            ? '<span class="prazo-' + prazo.tom + '">' + esc(prazo.texto) + "</span>"
            : '<span class="vazio-celula">—</span>') + "</td>" +
          "</tr>";
      }).join("")
    : '<tr><td colspan="7" class="vazio">Nenhum processo corresponde aos filtros.</td></tr>';

  alvo.innerHTML =
    '<div class="tabela-wrap"><table><thead><tr>' +
      "<th>UF</th><th>Cargo</th><th>Urna</th><th>Nome</th><th>Processo</th>" +
      "<th>Diligência</th><th>Prazo</th>" +
    "</tr></thead><tbody>" + corpo + "</tbody></table></div>" +
    paginacao("todos", p);
}

function moduloDiligencias(p) {
  var registros = estado.carga.registros;

  // Os status vêm da planilha, não de uma lista fixa — o vocabulário é aberto.
  var status = {};
  p.diligencias.forEach(function (i) { status[i.registro.diligencia.status] = true; });

  return '<section><h2 class="section-label">Quadro de diligências</h2>' +
      '<p class="nota-secao">Visão consolidada das diligências. ' +
      '<div id="fila-chips"></div>' +
      '<div class="filtros">' +
        '<input type="search" id="fila-busca" placeholder="Buscar por nome, processo ou diligência" aria-label="Buscar no quadro">' +
        '<select id="fila-uf" aria-label="Filtrar por UF"><option value="">Todas as UFs</option>' +
          opcoes(unicos(registros, "uf"), estado.fila.uf) + "</select>" +
        '<select id="fila-status" aria-label="Filtrar por status"><option value="">Todos os status</option>' +
          opcoes(Object.keys(status).sort(), estado.fila.status) + "</select>" +
      "</div>" +
      '<div id="fila-conteudo"></div>' +
    "</section>" +

    '<section><h2 class="section-label">Todos os candidatos</h2>' +
      '<p class="nota-secao">A relação completa dos ' + p.totalProcessos +
      " processos da planilha, com ou sem diligência.</p>" +
      '<div class="filtros">' +
        '<input type="search" id="todos-busca" placeholder="Buscar por nome, processo ou urna" aria-label="Buscar">' +
        '<select id="todos-uf" aria-label="Filtrar por UF"><option value="">Todas as UFs</option>' +
          opcoes(unicos(registros, "uf"), estado.todos.uf) + "</select>" +
        '<select id="todos-cargo" aria-label="Filtrar por cargo"><option value="">Todos os cargos</option>' +
          opcoes(unicos(registros, "cargo"), estado.todos.cargo) + "</select>" +
        "<label><input type=\"checkbox\" id=\"todos-dil\"> Só com diligência</label>" +
      "</div>" +
      '<div id="todos-conteudo"></div>' +
    "</section>";
}

/* ================================================================== */
/*  Ligação de eventos                                                 */
/* ================================================================== */

function ligar(id, evento, fn) {
  var el = document.getElementById(id);
  if (el) el.addEventListener(evento, fn);
}

function ligarDiligencias() {
  // Os chips são refeitos a cada desenho — as contagens dependem dos filtros —,
  // então a escuta fica no contêiner, que é estável.
  var chips = document.getElementById("fila-chips");
  if (chips) {
    chips.addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-situacao], [data-faixa]");
      if (!b || b.disabled) return;
      if (b.hasAttribute("data-situacao")) {
        estado.fila.situacao = b.getAttribute("data-situacao");
        // Trocar de situação pode zerar a faixa escolhida; sem isto o quadro
        // ficaria vazio sem que nada na tela explicasse por quê.
        estado.fila.faixa = "";
      } else {
        estado.fila.faixa = b.getAttribute("data-faixa");
      }
      estado.fila.pagina = 1;
      desenharFila();
    });
  }

  ligar("fila-status", "change", function () {
    estado.fila.status = this.value; estado.fila.pagina = 1; desenharFila();
  });

  var fb = document.getElementById("fila-busca");
  if (fb) {
    fb.value = estado.fila.busca;
    fb.addEventListener("input", function () {
      estado.fila.busca = this.value; estado.fila.pagina = 1; desenharFila();
    });
  }
  ligar("fila-uf", "change", function () {
    estado.fila.uf = this.value; estado.fila.pagina = 1; desenharFila();
  });

  var tb = document.getElementById("todos-busca");
  if (tb) {
    tb.value = estado.todos.busca;
    tb.addEventListener("input", function () {
      estado.todos.busca = this.value; estado.todos.pagina = 1; desenharTodos();
    });
  }
  ligar("todos-uf", "change", function () {
    estado.todos.uf = this.value; estado.todos.pagina = 1; desenharTodos();
  });
  ligar("todos-cargo", "change", function () {
    estado.todos.cargo = this.value; estado.todos.pagina = 1; desenharTodos();
  });
  var td = document.getElementById("todos-dil");
  if (td) {
    td.checked = estado.todos.somenteDiligencia;
    td.addEventListener("change", function () {
      estado.todos.somenteDiligencia = this.checked; estado.todos.pagina = 1; desenharTodos();
    });
  }
}

/* Os controles de paginação são recriados a cada desenho, então a escuta vive
   no documento em vez de em cada botão. */
document.addEventListener("click", function (ev) {
  var b = ev.target.closest ? ev.target.closest("[data-pag]") : null;
  if (!b || b.disabled) return;
  var nome = b.getAttribute("data-pag");
  estado[nome].pagina = Number(b.getAttribute("data-ir"));
  (nome === "fila" ? desenharFila : desenharTodos)();
});

document.addEventListener("change", function (ev) {
  var s = ev.target.closest ? ev.target.closest("[data-tamanho]") : null;
  if (!s) return;
  var nome = s.getAttribute("data-tamanho");
  estado[nome].porPagina = Number(s.value);
  estado[nome].pagina = 1;
  (nome === "fila" ? desenharFila : desenharTodos)();
});

/* ================================================================== */
/*  Montagem                                                           */
/* ================================================================== */

var raiz = document.getElementById("raiz");
var lendo = false;

function desenhar() {
  var carga = estado.carga;
  var p = estado.painel;
  var mod = estado.modulo;

  raiz.className = "wrap";
  raiz.innerHTML =
    '<header class="topo"><div>' +
      '<div class="eyebrow">Monteiro e Monteiro Advogados</div>' +
      "<h1>Registro de <em>Candidatura</em></h1>" +
      '<p class="subtitulo">Dashboard para acompanhamento dos procedimentos de Registro de Candidatura · Eleições 2026 </p>' +
    "</div>" +
    '<div class="controle-topo">' +
      '<span class="carimbo num" id="carimbo">Atualizado às ' + horaLocal(carga.lidoEm) + "</span>" +
      '<button type="button" class="btn-secundario" id="btn-atualizar">Atualizar</button>' +
    "</div></header>" +

    '<nav class="nav">' +
      '<a href="#visao"' + (mod === "visao" ? ' aria-current="page"' : "") + ">Visão geral</a>" +
      '<a href="#diligencias"' + (mod === "diligencias" ? ' aria-current="page"' : "") + ">Diligências" +
        (p.diligenciasAbertas ? '<span class="nav-conta num">' + p.diligenciasAbertas + "</span>" : "") +
      "</a>" +
    "</nav>" +

    (mod === "visao" ? moduloVisao(p) : moduloDiligencias(p)) +

    "<footer>Monteiro e Monteiro. Eleições 2026. Todos os direitos reservados".</footer>";

  document.getElementById("btn-atualizar").addEventListener("click", function () { atualizar(true); });

  if (mod === "diligencias") {
    ligarDiligencias();
    desenharFila();
    desenharTodos();
  }
}

function mostrarFalha(erro) {
  raiz.className = "tela-cheia";
  raiz.innerHTML =
    '<div class="eyebrow">Monteiro e Monteiro Advogados</div>' +
    "<h1>Painel indisponível no momento</h1>" +
    "<p>A planilha não pôde ser lida. O painel não guarda cópia dos dados: sem acesso à " +
    "planilha, não há o que exibir.</p>" +
    '<p class="detalhe">' + esc(erro.message || erro) + "</p>" +
    '<p class="detalhe">Se esta página foi aberta direto do disco, é essa a causa: o painel ' +
    "precisa ser servido por HTTP.</p>";
}

/* Trocar de módulo não relê a planilha — os dados já estão em memória. */
window.addEventListener("hashchange", function () {
  var novo = moduloDoHash();
  if (novo === estado.modulo || !estado.carga) return;
  estado.modulo = novo;
  desenhar();
  window.scrollTo(0, 0);
});

/* Uma releitura automática no meio de uma digitação tiraria o foco do campo e
   perderia o que estava sendo digitado. Nesse caso ela espera o próximo ciclo. */
function ocupadoDigitando() {
  var a = document.activeElement;
  return !!a && (a.tagName === "INPUT" || a.tagName === "SELECT");
}

function atualizar(manual) {
  if (lendo) return;
  if (!manual && ocupadoDigitando()) return;
  lendo = true;

  var botao = document.getElementById("btn-atualizar");
  if (botao) { botao.disabled = true; botao.textContent = "Lendo…"; }

  lerAba()
    .then(function (aba) {
      estado.carga = normalizar(aba);
      estado.painel = agregar(estado.carga);
      desenhar();
    })
    .catch(function (erro) {
      // Uma falha momentânea não deve apagar um painel já desenhado.
      if (estado.carga) {
        var c = document.getElementById("carimbo");
        if (c) c.textContent = "Falha ao atualizar — exibindo a última leitura";
        if (botao) { botao.disabled = false; botao.textContent = "Atualizar"; }
      } else {
        mostrarFalha(erro);
      }
    })
    .finally(function () { lendo = false; });
}

estado.modulo = moduloDoHash();
atualizar(true);
setInterval(function () { atualizar(false); }, INTERVALO * 1000);

})();
</script>
